# Perfil complementario: usar junto a dev/prod después de revisar el destino e historial Flyway.
# El esquema del módulo se administra exclusivamente mediante migraciones.
spring.flyway.locations=classpath:db/scripts
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false

# Activar cuando PostgreSQL y MongoDB correspondan a la misma instalación.
tramites.limpieza.enabled=false
